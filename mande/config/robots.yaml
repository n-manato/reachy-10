# Fleet registry.
#
# Keyed on `hardware_id` -- the only stable identifier. It comes from
# GET /api/daemon/hardware-id and survives reboots, DHCP leases and hostname
# changes. `ip` is a CACHE refreshed by `orchestra fleet discover`; never treat
# it as identity. `mac` is here so you can pin DHCP reservations on the Speedefy
# router (recommended -- router-side change, touches zero robots).
#
# `role` and `instrument` are DEFAULT assignments. A song may override them in
# its own song.yaml cast block, so a robot can play shaker in one piece and sing
# in the next.
#
# 2026-08-07: 物理楽器を廃止した。楽器音はすべて各機のスピーカーから出るので、
# `instrument` はもう「取り付けてある物」ではなく「その機体の**既定の役**」を
# 表すだけになった。1台=1音程という制約も消えたので `pitch` は削除した
# （各機はステム1本を丸ごと鳴らす）。実際の割り当ては song.yaml の cast が決める。
#
# Values below were read live from the fleet on 2026-08-06.
#
# 2026-08-28: 西アフリカ・マンデ（マリ／ギニア）の Lamban 編成に差し替えた。
# r01 が指揮＋ソロ djembe（djembefola）のコール、r02-r09 が8種の別々の楽器。
# 歌は使わない。楽器名は3つの名前空間（audio のプリセット / motion のペルソナ /
# ここ）で綴りを一致させること ―― ペルソナは未知名を例外にせず「構えなし」に
# 落とすので、綴り違いは無言で棒立ちのロボットになる。

robots:
  - id: r01
    hardware_id: "84153d674c8451fb"
    mac: "88:a2:9e:78:f5:e6"
    ip: 192.168.3.105
    variant: wireless
    role: conductor

  - id: r02
    hardware_id: "fc83e0cbcea9de82"
    mac: "88:a2:9e:8d:51:c1"
    ip: 192.168.3.120
    variant: wireless
    # 2026-08-07: 当初 `lite` としていたが誤り。調査時点でカメラが未接続
    # (/dev/video0 が無い唯一の個体) だったためデーモンが lite と申告していた。
    # カメラ修理後は他機と同じ imx708 / wireless を報告する。
    role: performer
    instrument: balafon    # Lamban の発祥楽器。主旋律オスティナート

