[project]
name = "reachy-orchestra"
version = "0.1.0"
description = "Reachy Mini robot orchestra -- West African Mande ensemble (Lamban)"
requires-python = ">=3.11"

dependencies = [
    # Robot SDK. Robots in this fleet run daemon 1.9.0; keep the PC in step.
    # See docs/EXPERIMENTS.md N-1 -- if 1.9.0 is unavailable on PyPI, 1.8.0 works
    # for everything except exact protocol parity, because the on-robot agent
    # uses the robot's own SDK.
    "reachy-mini>=1.8.0",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "requests>=2.31",
    "websockets>=12.0",
    "mido>=1.3",          # MIDI parsing (pure python, no rtmidi backend needed)
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]      # orchestra clip plot
dev = ["pytest>=8.0"]
[project.scripts]
orchestra = "orchestra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
