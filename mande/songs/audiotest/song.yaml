# 音だけの試験。**一切動かない**（全パート kind: idle）。
# 目的: サーボ音に埋もれない条件で、ステムが本当にスピーカーから出ているかを見る。
# 中身は lamban の 100-130 秒（全パートが鳴っている区間）をそのまま切り出したもの。
song:
  name: audiotest
  title: "Audio-only test (no motion)"
  bpm: 100
  meter: [4, 4]
  bars: 12
  lead_in_s: 0.5
  tail_s: 0.5

parts:
  lead:
    kind: idle
    instrument: audiotest
    audio: lead.wav
  balafon:
