    audio: kora.wav
  ngoni:
    kind: idle
    instrument: audiotest
    audio: ngoni.wav
  tama:
    kind: idle
    instrument: audiotest
    audio: tama.wav
  djembe:
    kind: idle
    instrument: audiotest
    audio: djembe.wav
  dundunba:
    kind: idle
    instrument: audiotest
    audio: dundunba.wav
  sangban:
    kind: idle
    instrument: audiotest
    audio: sangban.wav
  karignan:
    kind: idle
    instrument: audiotest
