# generated by tools/make_calibration.py
#
# A 'song' that exists only to measure arrival times: chirps, not a
# melody. The real piece cannot measure this -- music repeats, so the
# correlation never produces a clean peak. Here each robot sounds at a
# different moment, so it is always isolated in the recording.
