song:
  name: small_world
  title: "It's a Small World"
  midi: small_world.mid
  bpm: 80              # 採譜元のテンポ。上げたければここだけ変える
                       # （`song build` が新しいテンポで安全ゲートを回し直す）
  meter: [4, 4]
  lead_in_s: 2.5        # T0 はここ。指揮者の予備拍はこの中に入る。
                        # 打点クリップの振りかぶりも、ここへ食い込んで置かれる。
  tail_s: 0.35        # 終止和音の余韻が消えるまで。実測でここが音の終わり
  bars_per_phrase: 4    # 32小節 = Verse8 + Chorus8 + Verse8 + Chorus8。
                        # フレーズの切れ目で指揮者へ視線を送るので、細かすぎると
                        # 落ち着きが無くなる。4小節で12秒に1回。

# ---------------------------------------------------------------------------
# 編成: 指揮者1 + 歌2（ハモる）+ 楽器6
# ---------------------------------------------------------------------------
# 物理楽器を廃止し、音はすべて各ロボットのスピーカーから出る。したがって
# 「1台＝1音程」という制約が消え、歌が旋律を担えるようになった。元が歌なので
# これが自然な形。
#
# 2026-08-07: 記憶で書いた仮の旋律を捨て、実際の採譜（32小節・Verse+Chorus）に
# 差し替えた。各パートは **MIDI の実トラック** を弾く。移調で作った偽の
# ハモリはもう要らない ―― 本物の対旋律が譜面に入っている。
#   Melody  … 主旋律
#   Harmony … 裏拍のコード刻み（伴奏）。歌う線ではない
#   Counter … ★この曲の看板。Chorus の裏で Verse の旋律を歌う対位法
#   Bass    … ベースライン
#
# 見分けの設計: 8台がそれぞれ**動きの質**で違う。歌は打点が無く頭を上げ、
# グロッケンは小さく速く、マリンバは大きく低く横に動き、ウッドブロックは
# 単発で止まり、タンバリンは roll、シェイカーは左右往復で止まらず、鈴は耳。
# 遠目でも誰が何を担当しているか分かるようにしてある。

# ---------------------------------------------------------------------------
# オープニング: 指揮者が挨拶し、8台が順に自分の楽器を鳴らして名乗る
# ---------------------------------------------------------------------------
# `lead_in_s` を伸ばして代用していない。あれは「打点クリップの振りかぶりが
# 収まる余裕」という別の意味で、build.py の警告がそれと比較している。
# 30秒に伸ばすとその警告が永久に鳴らなくなる。T0 だけが後ろへずれる。
#
# 名乗りの振り付けは書いていない ―― `persona.showcase` が**本番の構えを
# 誇張したもの**を生成する。だから紹介と演奏中の姿が食い違いようがなく、
# 名乗りの最後は本番の構えちょうどに収まる。
intro:
  lead_s: 1.0           # 起き上がってから間を置く
  greet_s: 3.5          # 指揮者が客席へ一礼
  # 指揮者はアンサンブルを向いて立っているので、客席へ 180° 回ってから礼をする。
  # lead_s + greet_s の枠の中で回って戻るので、曲の長さは変わらない。
  greet_turn_deg: 180.0
  greet_turn_s: 1.6     # 片道。1.47 秒を切ると body_yaw が 4.0 rad/s を超える計算
  slot_s: 2.6           # 1台あたり（合図 + 鳴らす）
  cue_s: 0.7            # うち、指揮者が「出て」を出す時間。台が鳴るのはその後
  gap_s: 0.3            # 間を空けないと8台が1つの動きに見える
  settle_s: 3.0         # 全員が構えを取り終える
  order: [lead, counter, glocken, marimba, accent, ride, pulse, colour]

# ---------------------------------------------------------------------------
# 終止形
# ---------------------------------------------------------------------------
# この採譜は「終わる」のではなく**フェードアウトする**。実測した velocity は
# 94 -> 86 -> 72 -> 56 -> 11 -> 8 と落ちていき、最後は次の繰り返しの頭が
# vel 34 で2音だけ残る。遊園地の無限ループそのままで、終止形が入っていない。
# だから「最後まで演奏していない」ように聞こえていた ―― 実際そのとおりだった。
#
#   unfade  … 消えていく velocity をフェード前の水準へ戻す
#   trim    … 終止のあとに残る繰り返しの頭を捨てる
#   at_bar  … 主旋律が C5 を伸ばすところ。そこへ全員で主和音を重ねて終わる
finale:
  unfade_from_bar: 29.0
  trim_after_bar: 31.5
  at_bar: 31.5
  hold_beats: 6.0
  velocity: 100
  notes:
    Counter: [69]       # A4
    Harmony: [77]       # F5
    Bass:    [41]       # F2

# ---------------------------------------------------------------------------
# エンディング: 全員で礼をして、顔をしまう
# ---------------------------------------------------------------------------
# 就寝は SDK の goto_sleep() ではなく**演奏プログラムの中**でやる。
# teardown の goto_sleep は9台バラバラに動き（HTTP を並列に叩くだけ）、
# 各台が go_sleep.wav を鳴らす。プログラムに入れればフレーム同期で揃うし、
# song build の検査にも clip plot にも録音にも乗る。
#
# これが可能になったのは可動域の z を実測で直したから（config/fleet.yaml）。
# SDK の park 姿勢 z=-44mm は、実測で全関節に余裕 +15.25° あった。
outro:
  # ★音が止まった瞬間に始める★ 実測で全パートが鳴り終わるのは終止和音の
  # 減衰も含めて music_end + 0.35s。tail_s 2.5 のままだと 2.15秒 の空白が
  # できて「終わったのに何も起きない間」になっていた。
  ready_s: 0.9          # 耳を上げて9台をそろえる（顔もここで水平に戻る）
  bow_s: 3.5
  hold_s: 1.2
  rise_s: 1.8
  stow_s: 3.0
  rest_s: 1.5
  # ★指揮者は台の上で 90° 回して置くこと★（設定と対になる物理的な前提）
  #
  # body_yaw の可動域は ±150°（機構は ±160°）。正面を機構ゼロに置くと、
  # 礼のときに 180° 反転できない。そこで演奏中の向きを -90°、礼の向きを
  # +90° に取る。差はちょうど 180° で、どちらも可動域の内側に収まる。
  #
  #   機構 -90°  = アンサンブルを見る向き（演奏中）
  #   機構  0°   = 真横
  #   機構 +90°  = 客席を向く（礼）
  #
  # つまり**機構ゼロが客席から見て真横になるように設置する**。
  # 頭も一緒に回すので、相対 yaw（上限45°）は消費しない。
  conductor_home_yaw_deg: -90.0
  conductor_turn_deg: 180.0

parts:
  conductor:
    kind: conductor
    audio: conductor.wav        # カウントインのクリック + 和声のベッド
    mix_db: -9.0                # 以下7本は伴奏。歌の下に敷く（上の注記を参照）

  # -- 主旋律と対旋律 ------------------------------------------------------
  # 2026-08-08: 歌をやめて全部を楽器にした。歌声は3方式（音節TTS+LPC /
  # 行TTS+WORLD / DiffSinger）作ったが、どれも「ノイズと機械音声感が抜けない」
  # という判断になった。合成の質だけでなく、そもそも**この編成に歌が要るか**が
  # 問われた形。楽器9台のほうが素材（gm.dls の実録音）の質で勝てる。
  # 歌の実装は残してあるが、この曲では使っていない。
  lead:
    kind: midi
    track: Melody
    clip: celesta/strike        # 鍵盤なので横に渡る。上下に振る3台と区別が付く
    instrument: celesta
    voice_preset: celesta       # オルゴール寄りの音色。この曲の性格に合う
    audio: lead.wav
    gain: 1.0
    mix_db: 0.0                 # ★主役。ここが基準★ 全ステムを同じ RMS に
                                # 揃えるだけだと、足したときにパート数の多い
                                # ほうが勝つ。主旋律が伴奏の下に潜っていた
                                # （実測 -4.5dB）。主役を上げるのではなく
                                # **伴奏を下げる** ―― balance() は各ステムの
                                # ピークを -6 dBFS で頭打ちにするので、上げる
                                # 方向は効かない。

  counter:
    kind: midi
    track: Counter              # ★この曲の看板。Chorus の裏で Verse を鳴らす対位法。
                                # 当初ここに Harmony(trk3) を当てていたが、あれは
                                # 裏拍のコード刻みで、歌う線ではなかった。
                                # Verse の間は休むので、Chorus での登場が立つ。
    clip: vibraphone/strike     # 打ったあとに揺れが残る。9台で唯一
    instrument: vibraphone
    voice_preset: vibraphone
    audio: counter.wav
    gain: 0.9
    mix_db: -3.0                # 主旋律の一段下。対位法なので聞こえないと
                                # 意味が無いが、主旋律を食ってもいけない

  # -- 旋律楽器 ----------------------------------------------------------
  glocken:
    kind: midi
    track: Harmony              # 裏拍のコード刻み。小さく速い打点が
                                # 裏拍に入るのは、この楽器の得意な形
    clip: glocken/strike
    instrument: glockenspiel
    voice_preset: glockenspiel
    audio: glocken.wav
    gain: 0.9
    mix_db: -9.0

  marimba:
    kind: midi
    track: Bass                 # ベースライン。低く大きく横に動く役に合う
    clip: marimba/strike
    instrument: marimba
    voice_preset: marimba
    audio: marimba.wav
    gain: 0.85
    mix_db: -8.0

  # -- リズム ------------------------------------------------------------
  # X=アクセント x=打つ .=休み |=小節線（見た目だけ）。16ステップ×0.25 = 1小節
  accent:
    kind: pattern
    pattern: "X.......x......."
    step: 0.25
    clip: woodblock/hit
    instrument: woodblock
    voice_preset: woodblock
    audio: woodblock.wav
    gain: 1.0
    mix_db: -9.0
    end_bar: 31.5          # 終止和音で止める。既定だと 1.7秒 鳴り残った

  ride:
    kind: pattern
    clip: tambourine/ride       # ループ型。クリップ内蔵のリズムで鳴り続ける
    instrument: tambourine
    voice_preset: tambourine
    audio: tambourine.wav
    gain: 0.75
    mix_db: -10.0
    end_bar: 31.5          # 終止和音で止める。既定だと 1.7秒 鳴り残った

  pulse:
    kind: pattern
    clip: shaker/shake
    instrument: shaker
    voice_preset: shaker
    audio: shaker.wav
    gain: 0.7
    mix_db: -10.0
    end_bar: 31.5          # 終止和音で止める。既定だと 1.7秒 鳴り残った

  colour:
    kind: pattern
    clip: bells/ring
    instrument: bells
    voice_preset: jingle_bells
    audio: bells.wav
    gain: 0.7
    mix_db: -10.0
    end_bar: 31.5          # 終止和音で止める。既定だと 1.7秒 鳴り残った

# ---------------------------------------------------------------------------
cast:
  conductor:     r01
  lead:          r02
  counter:       r03
  glocken:       r04
  marimba:       r05
  accent:        r06
  ride:          r07
  pulse:         r08
  colour:        r09

# ---------------------------------------------------------------------------
# 表現
# ---------------------------------------------------------------------------
secondary:
  groove: true        # ★全機が常に軽くリズムに乗る。自分の出番が無い間も。
                      #  これが入るかどうかで「合奏している集団」に見えるかが決まる
  breathing: true     # 休みの間も生きて見える
  phrase_sway: true   # フレーズに沿ったゆっくりした傾き
  attention: true     # フレーズの切れ目で指揮者へ視線を送る
